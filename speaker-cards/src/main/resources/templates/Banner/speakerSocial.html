<!DOCTYPE html PUBLIC "-//OPENHTMLTOPDF//DOC XHTML Character Entities Only 1.0//EN" "">
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{speaker.firstName} {speaker.lastName} — jChampions {year}</title>
  <style>
    {#include Banner/cardStyles.html /}
    @page { size: 1080px 1080px; margin: 0; }
    .intro { position: absolute; left: 56px; top: 196px; width: 968px; font-size: 22px; }
    .headline { position: absolute; left: 56px; top: 252px; width: 968px; }
    .portrait-ring { left: 56px; top: 555px; width: 260px; height: 260px; }
    .portrait { left: 87px; top: 586px; width: 198px; height: 198px; }
    .speaker-info { position: absolute; left: 360px; top: 576px; width: 645px; }
    .name { margin-bottom: 18px; }
    .role { font-size: 26px; max-width: 610px; }
    .footer { top: 875px; right: 310px; }
    .session-date { font-size: 28px; }
    .session-time { font-size: 23px; }
    .website { left: 0; right: auto; top: 128px; font-size: 25px; white-space: nowrap; }
    .duke { right: 4px; top: 793px; width: 262px; height: 314px; }
  </style>
</head>
<body class="square">
  <img class="brand" src="/static/images/2027/logo-dark.png" alt="jChampions Conference" />
  <div class="year">{year}</div>
  <div class="header-rule"></div>
  <div class="eyebrow intro">I'm speaking at jChampions</div>
  {#if talk != null && talk.title}
    <h1 class="headline" style="font-size: {card:fontSize(talk.title, 62, 34, 968, 4)}px">{talk.title}</h1>
  {#else}
    <h1 class="headline" style="font-size: 62px">See you at<br />jChampions {year}.</h1>
  {/if}
  <div class="portrait" style="background-image: url('{uri:Banner.speakerPhoto(speaker.id)}')"></div>
  <img class="portrait-ring" src="/static/images/2027/portrait-ring-dark.png" alt="" />
  <div class="speaker-info">
    <h2 class="name" style="font-size: {card:fontSize(speaker.toString(), 52, 30, 645, 2)}px">{speaker.firstName} {speaker.lastName}</h2>
    {#if speaker.title}<p class="role" style="font-size: {card:fontSize(speaker.title, 26, 18, 610, 3)}px">{speaker.title}</p>{/if}
  </div>
  <img class="duke" src="/static/images/2027/duke-wave.png" alt="Waving Duke" />
  {#include Banner/cardFooter.html /}
</body>
</html>
