<!DOCTYPE html PUBLIC "-//OPENHTMLTOPDF//DOC XHTML Character Entities Only 1.0//EN" "">
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{talk.title} — jChampions {year}</title>
  <style>
    {#include Banner/cardStyles.html /}
    @page { size: 1280px 720px; margin: 0; }
    .talk-label { position: absolute; left: 56px; top: 182px; width: 730px; }
    .headline { position: absolute; left: 56px; top: 230px; width: 730px; }
    .speakers { position: absolute; left: 864px; top: 203px; width: 360px; }
    .speaker-row { width: 100%; border-collapse: collapse; margin-bottom: 22px; }
    .speaker-row td { vertical-align: middle; padding: 0; }
    .photo-cell { width: 114px; }
    .speaker-photo { width: 92px; height: 92px; border-radius: 50%; background-size: cover; background-position: center; border: 3px solid #FF691B; }
    .speaker-name { font-size: 24px; font-weight: 600; line-height: 1.25; word-wrap: break-word; }
    .single .photo-cell { width: 152px; }
    .single .speaker-photo { width: 128px; height: 128px; }
    .compact .photo-cell { width: 80px; }
    .compact .speaker-photo { width: 62px; height: 62px; }
    .compact .speaker-name { font-size: 20px; }
    .compact .speaker-row { margin-bottom: 15px; }
    .many .photo-cell { display: none; }
    .many .speaker-row { margin-bottom: 10px; }
    .many .speaker-name { font-size: 18px; }
    .duke { left: 878px; top: 18px; width: 100px; height: 120px; }
  </style>
</head>
<body class="wide light">
  <img class="brand" src="/static/images/2027/logo-light.png" alt="jChampions Conference" />
  <div class="year">{year}</div>
  <div class="header-rule"></div>
  <div class="eyebrow talk-label">The session</div>
  <h1 class="headline" style="font-size: {card:fontSize(talk.title, 58, 30, 730, 5)}px">{talk.title}</h1>
  <div class="speakers {#if talk.speakers.size == 1}single{/if} {#if talk.speakers.size > 3}compact{/if} {#if talk.speakers.size > 5}many{/if}">
    {#for speaker in talk.speakers}
      <table class="speaker-row"><tr>
        <td class="photo-cell"><div class="speaker-photo" style="background-image: url('{uri:Banner.speakerPhoto(speaker.id)}')"></div></td>
        <td><div class="speaker-name">{speaker.firstName}<br />{speaker.lastName}</div></td>
      </tr></table>
    {/for}
  </div>
  <img class="duke" src="/static/images/2027/duke-wave.png" alt="Waving Duke" />
  {#include Banner/cardFooter.html /}
</body>
</html>
